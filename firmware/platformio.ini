; RainSong — Seeed XIAO ESP32C3
; Upload/monitor only this board (not the Pico on ttyACM0).

[env:seeed_xiao_esp32c3]
platform = espressif32@6.10.0
board = seeed_xiao_esp32c3
framework = arduino
monitor_speed = 115200
monitor_filters = time
upload_speed = 115200
upload_flags =
    --no-stub
    --before=usb_reset
upload_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_44:B1:76:5F:65:F4-if00
monitor_port = /dev/serial/by-id/usb-Espressif_USB_JTAG_serial_debug_unit_44:B1:76:5F:65:F4-if00
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.3
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
